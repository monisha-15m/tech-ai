<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechHelp</title>
<style>
  :root {
    --accent: #7c3aed;
    --accent-2: #22d3ee;
    --bg: #12081f;
    --panel: rgba(255, 255, 255, 0.06);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #f2f2f7;
    --text-dim: #b9b9c6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--accent-2) 0%, transparent 40%),
                radial-gradient(circle at 80% 0%, var(--accent) 0%, transparent 35%),
                var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 88vh;
    max-height: 820px;
    background: rgba(15, 15, 25, 0.55);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }

  header .emoji {
    font-size: 28px;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
    color: #0b0b0f;
  }

  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: rgba(0,0,0,0.6);
  }

  #chat-window {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble.bot {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-bottom-left-radius: 4px;
  }

  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0b0f;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .bubble.typing {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  #input-area {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--panel-border);
    background: rgba(0,0,0,0.15);
  }

  #message-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }

  #message-input:focus {
    border-color: var(--accent-2);
  }

  #send-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b0b0f;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  #send-btn:hover { transform: translateY(-1px); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #chat-window::-webkit-scrollbar { width: 8px; }
  #chat-window::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="emoji">💻</div>
      <div>
        <h1>TechHelp</h1>
        <p>Focused assistant &middot; single-topic domain</p>
      </div>
    </header>

    <div id="chat-window"></div>

    <div id="input-area">
      <input id="message-input" type="text" placeholder="Type your message..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  const greeting = "Hi! I'm TechHelp 💻 — ask me about computers, software, or tech troubleshooting.";

  function addBubble(text, sender) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + sender;
    bubble.textContent = text;
    chatWindow.appendChild(bubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  function addTypingBubble() {
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot typing';
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatWindow.appendChild(bubble);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const typingBubble = addTypingBubble();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingBubble.remove();
      addBubble(data.reply || 'No response received.', 'bot');
    } catch (err) {
      typingBubble.remove();
      addBubble('Network error. Please try again.', 'bot');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  window.addEventListener('DOMContentLoaded', () => {
    addBubble(greeting, 'bot');
  });
</script>
</body>
</html>
